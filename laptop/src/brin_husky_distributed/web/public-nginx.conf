worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    gzip on;
    gzip_comp_level 2;
    gzip_types application/javascript application/json text/css image/svg+xml;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 127.0.0.1:8088;
        server_name _;
        root /srv/dashboard;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;

        location = /api { return 404; }
        location ^~ /_internal { return 404; }
        location ^~ /api/_internal { return 404; }

        location /api/ {
            proxy_pass http://__BRIN_API_HOST__:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host __BRIN_API_HOST__:8000;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Accept-Encoding "";
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_redirect http://__BRIN_API_HOST__:8000/ /api/;
            sub_filter_types application/json;
            sub_filter_once off;
            sub_filter 'http://__BRIN_API_HOST__:8000/cache/' '/api/cache/';
        }
        location = /trajectory {
            proxy_pass http://127.0.0.1:8006/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
