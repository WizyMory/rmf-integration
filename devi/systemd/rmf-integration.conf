# Override the stale devi_config entry; preserve the existing service identity.
[Unit]
After=network-online.target
Wants=network-online.target

[Service]
WorkingDirectory=/home/devi/rmf-integration
Environment=ROS_DOMAIN_ID=0
Environment=RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
Environment=ROS_LOCALHOST_ONLY=0
ExecStart=
ExecStartPre=/bin/bash /home/devi/rmf-integration/devi/systemd/wait_for_devices.bash
ExecStart=/bin/bash /home/devi/rmf-integration/tools/devi.bash bringup rviz:=false
Restart=on-failure
RestartSec=5
KillSignal=SIGINT
KillMode=control-group
TimeoutStopSec=15
