# Nav2 indoor DEVI (Okt 2026): peta + AMCL (devi_localization/amcl.launch.py),
# RPLIDAR C1 (/devi/rplidar/scan_filtered), odometry ekf_local.
# Dipakai launch/navigation.launch.py. Basis: nav2_bringup/params/nav2_params.yaml
# (humble); perubahan ditandai DEVI:, sisanya nilai bawaan Nav2.
#
# Kecepatan: 0.5 m/s, 0.8 rad/s (30 Okt 2026; uji pertama 0.3 / 0.5 terlalu lambat).
# Kalau diubah lagi, ubah BERSAMAAN: FollowPath (max_vel_*, max_speed_xy) dan
# velocity_smoother (max_velocity/min_velocity).
#
# FOOTPRINT MASIH PLACEHOLDER (30 Okt 2026) -- ganti dengan ukuran badan robot
# (frame base_link = tengah sumbu roda, +x depan, +y kiri) di local_costmap
# DAN global_costmap.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered                # DEVI: output ekf_local (bawaan /odom)
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # BT bawaan: navigate_to_pose_w_replanning_and_recovery.xml.
    # plugin_lib_names SENGAJA tidak diisi (30 Okt 2026): bt_navigator memakai
    # daftar bawaan dari versi Nav2 yang terpasang. Daftar dari nav2_params.yaml
    # terbaru bisa memuat plugin yang belum ada di versi apt robot -> bt_navigator
    # gagal configure dan seluruh Nav2 batal aktif.

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # DWB (controller bawaan Nav2 humble)
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0                              # tidak mundur
      min_vel_y: 0.0
      max_vel_x: 0.5                              # DEVI (bawaan 0.26, TurtleBot3; uji pertama 0.3)
      max_vel_y: 0.0
      max_vel_theta: 0.8                          # DEVI (bawaan 1.0; uji pertama 0.5)
      min_speed_xy: 0.0
      max_speed_xy: 0.5                           # DEVI: = max_vel_x
      min_speed_theta: 0.0
      acc_lim_x: 1.0                              # DEVI: robot lebih berat dari TB3 (bawaan 2.5)
      acc_lim_y: 0.0
      acc_lim_theta: 2.0                          # DEVI (bawaan 3.2)
      decel_lim_x: -1.0                           # DEVI (bawaan -2.5)
      decel_lim_y: 0.0
      decel_lim_theta: -2.0                       # DEVI (bawaan -3.2)
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4                                    # DEVI (bawaan 3)
      height: 4
      resolution: 0.05
      # DEVI: footprint PLACEHOLDER, samakan dengan global_costmap.
      footprint: "[[0.45, 0.35], [0.45, -0.35], [-0.70, -0.35], [-0.70, 0.35]]"
      plugins: ["obstacle_layer", "inflation_layer"]   # DEVI: obstacle_layer 2D (bawaan voxel_layer)
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /devi/rplidar/scan_filtered      # DEVI
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.8
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      # DEVI: footprint PLACEHOLDER, samakan dengan local_costmap.
      footprint: "[[0.45, 0.35], [0.45, -0.35], [-0.70, -0.35], [-0.70, 0.35]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True       # /map dari map_server (amcl.launch.py)
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /devi/rplidar/scan_filtered      # DEVI
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.8
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5                       # DEVI (bawaan 1.0)
    min_rotational_vel: 0.3                       # DEVI (bawaan 0.4)
    rotational_acc_lim: 2.0                       # DEVI (bawaan 3.2)

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 0.8]                 # DEVI: = FollowPath
    min_velocity: [-0.5, 0.0, -0.8]               # negatif dipakai behavior backup
    max_accel: [1.0, 0.0, 2.0]                    # DEVI: = FollowPath acc_lim
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: /odometry/filtered                # DEVI (dipakai hanya kalau feedback CLOSED_LOOP)
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0