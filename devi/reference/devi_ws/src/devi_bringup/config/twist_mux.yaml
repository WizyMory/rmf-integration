twist_mux:
  ros__parameters:
    topics:
      joy:
        topic: /devi/cmd_vel_joy
        timeout: 0.5
        priority: 100   # override manual selalu menang selama joystick aktif
      key:
        topic: /devi/cmd_vel_key
        timeout: 0.5
        priority: 90    # manual juga, tapi di bawah joy -- kalau dua-duanya
                         # aktif bersamaan (jarang, biasanya cuma salah satu
                         # dipakai), joystick yang menang
      nav:
        topic: /devi/cmd_vel_nav
        timeout: 0.5
        priority: 10
